<!DOCTYPE html>
<html lang="ja">
<head>

<title>HORIZON BREAKER - 3D Side Action</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #uiRoot{position:fixed;inset:0;pointer-events:none;z-index:5;}
  #uiRoot > *{pointer-events:auto;}
  .hidden{display:none !important;}
  .panel{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.62);z-index:20;padding:10px;
  }
  .panel-inner{
    width:min(640px,94vw);background:rgba(10,14,24,.94);
    border:2px solid #00e5ff;border-radius:18px;padding:16px;
    box-shadow:0 0 30px rgba(0,229,255,.25);max-height:92vh;overflow:auto;
  }
  h1{
    font-size:clamp(22px,4.2vw,44px);text-align:center;margin-bottom:10px;
    color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.7);letter-spacing:1px;
  }
  h2{
    font-size:clamp(18px,3.2vw,30px);margin-bottom:12px;color:#00e5ff;text-align:center;
  }
  p{font-size:14px;line-height:1.55;color:#dfe9ff;margin-bottom:8px;}
  .subtitle{text-align:center;color:#9ff;opacity:.85;margin-bottom:14px;font-size:13px;}
  .mainBtn,.stageBtn{
    display:block;width:100%;padding:14px 16px;margin:8px 0;border:none;
    border-radius:12px;background:linear-gradient(90deg,#0a3a52,#08253a);
    color:#e8fbff;font-size:16px;font-weight:700;cursor:pointer;
    border:1px solid rgba(0,229,255,.45);
  }
  .stageBtn{width:calc(50% - 6px);display:inline-block;margin:3px;}
  .mainBtn:active,.stageBtn:active{transform:scale(.98);}
  .mainBtn:disabled,.stageBtn:disabled{
    opacity:.32;cursor:not-allowed;border-color:#444;
  }
  .cleared{border-color:#00ff88;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  select,button{font:inherit;}
  select{
    width:100%;padding:12px;border-radius:10px;background:#0d1a2a;color:#fff;
    border:1px solid #2a7fff;
  }
  #hud{
    display:none;position:fixed;left:12px;top:12px;z-index:10;pointer-events:none;
    font-size:15px;line-height:1.45;text-shadow:0 0 8px rgba(0,0,0,.85);
  }
  #scoreHud{position:fixed;right:12px;top:12px;z-index:10;text-align:right;pointer-events:none;}
  #bossBar{
    display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%);
    width:min(440px,82vw);z-index:10;pointer-events:none;
  }
  #bossName{font-size:13px;margin-bottom:4px;text-align:center;text-shadow:0 0 8px #000;}
  #bossBarOuter{
    width:100%;height:14px;background:rgba(0,0,0,.55);border:1px solid #ff3355;border-radius:8px;overflow:hidden;
  }
  #bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3355,#ffaa33);}
  #touchControls{display:none;}
  @media (pointer:coarse){ #touchControls{display:block;} }
  #touchControls .touchBtn{
    position:absolute;width:78px;height:78px;border-radius:50%;
    background:rgba(0,229,255,.10);border:2px solid rgba(0,229,255,.55);
    color:#00e5ff;font-size:28px;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;touch-action:none;
  }

  #btnLeft{left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  #btnRight{left:108px;bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  #btnJump{right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));}

  const lang = save && save.lang ? save.lang : detectLang();
  return (UI[lang] && UI[lang][key]) ? UI[lang][key] : (UI.en[key] || key);
}
function bossNameFor(type){

}

/* ---------------- Save ---------------- */
let save = null;

function detectLang(){
  const n = (navigator.language || "en").slice(0,2);
  return UI[n] ? n : "en";
}
function defaultSave(){
  return {
    version:1,
    lang:detectLang(),
    sound:true,
    unlocked:1,
    coins:0,
    deaths:0,
    kills:0,
    totalScore:0
  };
}
function loadSave(){
  save = defaultSave();
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.version === 1){
        save = Object.assign({}, save, data);
        if(!UI[save.lang]) save.lang = detectLang();
        save.unlocked = clamp(parseInt(save.unlocked || "1", 10) || 1, 1, MAX_STAGE + 1);
        save.sound = !!save.sound;
      }
    }
  }catch(e){
    save = defaultSave();
  }
}
function saveNow(){
  try{
    save.version = 1;
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  }catch(e){}
}

/* ---------------- Basic utilities ---------------- */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function $(id){ return document.getElementById(id); }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- Audio ---------------- */
let audioCtx = null;
let noiseBuffer = null;

function initAudio(){
  if(audioCtx) {
    if(audioCtx.state === "suspended") audioCtx.resume();
    return;
  }
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sr = audioCtx.sampleRate;
    const len = Math.floor(sr * 0.3);
    noiseBuffer = audioCtx.createBuffer(1, len, sr);
    const data = noiseBuffer.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2 - 1);
  }catch(e){}
}

function tone(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(Math.max(20,freq), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq*1.001), t0+dur);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }catch(e){}
}
function sweep(start, end, dur, type, vol){
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(Math.max(20,start), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,end), t0+dur);
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function noise(dur, vol){
  if(!audioCtx || !noiseBuffer) return;
  try{
    const t0 = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const f = audioCtx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(1600, t0);
    f.frequency.exponentialRampToValueAtTime(100, t0+dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t0); src.stop(t0+dur+0.02);
  }catch(e){}
}
function playSound(kind){
  if(!save || !save.sound) return;
  if(!audioCtx) initAudio();
  if(!audioCtx) return;
  if(audioCtx.state === "suspended") audioCtx.resume();
  try{
    if(kind === "menu") tone(520, 0.05, "sine", 0.03);
    else if(kind === "jump") sweep(300, 520, 0.13, "square", 0.04);
    else if(kind === "doubleJump") sweep(430, 700, 0.13, "square", 0.04);
    else if(kind === "attack") sweep(750, 430, 0.07, "sawtooth", 0.035);
    else if(kind === "shoot") sweep(950, 250, 0.08, "square", 0.038);
    else if(kind === "hit") { noise(0.07, 0.05); tone(220,0.05,"sawtooth",0.035); }
    else if(kind === "block") sweep(360, 280, 0.06, "triangle", 0.04);
    else if(kind === "hurt") sweep(190, 70, 0.22, "sawtooth", 0.06);
    else if(kind === "coin") { tone(900,0.05,"sine",0.04); tone(1300,0.08,"sine",0.04,0.05); }
    else if(kind === "checkpoint") tone(800, 0.12, "triangle", 0.04);
    else if(kind === "explosion") { noise(0.22, 0.08); sweep(140, 60, 0.25, "sawtooth", 0.04); }
    else if(kind === "bossHit") { noise(0.04, 0.04); tone(160,0.04,"sawtooth",0.05); }
    else if(kind === "clear"){
      [523,659,784,1046,1318].forEach((f,i)=> tone(f,0.14,"square",0.05,i*0.12));
    }
  }catch(e){}
}

function showMenu(){
  state = "menu";

  $("hud").style.display = "none";
  $("scoreHud").style.display = "none";
  $("bossBar").style.display = "none";

function updateLanguage(){
  document.documentElement.lang = save.lang || "ja";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  $("rotatePrompt").textContent = t("rotateMsg");
  $("soundBtn").textContent = t("sound") + ": " + (save.sound ? t("on") : t("off"));
  $("langSelect").value = save.lang || "en";
  $("continueBtn").disabled = save.unlocked <= 1;
  if(!$("stagePanel").classList.contains("hidden")) updateStageSelect();
}
function updateStageSelect(){
  const grid = $("stageGrid");
  grid.innerHTML = "";
  for(let i=1;i<=MAX_STAGE;i++){
    const btn = document.createElement("button");
    btn.className = "stageBtn";
    const unlocked = (i <= save.unlocked);
    if(i < save.unlocked) btn.classList.add("cleared");
    btn.textContent = t("stage") + " " + i + (unlocked ? "" : " [" + t("locked") + "]");
    if(unlocked){
      btn.onclick = () => { initAudio(); playSound("menu"); startStage(i); };
    } else {
      btn.disabled = true;
    }
    grid.appendChild(btn);
  }

function showResult(clear){

  const msg = $("resultMsg");
  if(clear){
    if(stageIndex >= MAX_STAGE){
      title.textContent = t("allClearTitle");
      msg.textContent = t("allClearMsg");
      $("nextBtn").style.display = "none";
    }else{
      title.textContent = t("stageClearTitle");
      msg.textContent = t("clearMsg") + " " + t("nextStage") + " / " + t("stage") + " " + (stageIndex+1);

function initThree(){

    canvas: $("gameCanvas"),
    antialias: true,

  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000010);

  camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 220);
  camera.position.set(10, 8, 18);

  const amb = new THREE.AmbientLight(0xffffff, 0.68);
  scene.add(amb);

function onResize(){

  camera.aspect = w/h;

}

/* ---------------- Object cleanup ---------------- */
function disposeObject(obj){
  if(!obj) return;
  scene.remove(obj);
  obj.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else {
        if(o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    }
  });
}
function clearArray(list){
  for(const it of list){
    if(it && it.mesh) disposeObject(it.mesh);
  }
  list.length = 0;
}
function clearGameObjects(){
  if(player && player.mesh){ disposeObject(player.mesh); player = null; }
  boss = null;
  clearArray(platforms);
  clearArray(enemies);
  clearArray(playerBullets);
  clearArray(enemyBullets);
  clearArray(hazards);
  clearArray(coins);
  clearArray(checkpoints);
  clearArray(effects);
  clearArray(decorations);
}

/* ---------------- AABB helpers ---------------- */
function playerBox(p){
  return {
    minX:p.x-p.halfW, maxX:p.x+p.halfW,
    minY:p.y-p.halfH, maxY:p.y+p.halfH
  };
}
function entityBox(e){
  return {
    minX:e.x-e.halfW, maxX:e.x+e.halfW,
    minY:e.y-e.halfH, maxY:e.y+e.halfH
  };
}
function bulletBox(b){
  return {
    minX:b.x-b.r, maxX:b.x+b.r,
    minY:b.y-b.r, maxY:b.y+b.r
  };
}
function attackBox(p){
  const cx = p.x + p.face * 1.25;
  return {
    minX:cx-1.45, maxX:cx+1.45,
    minY:p.y-1.25, maxY:p.y+1.25
  };
}
function aabb(a,b){
  return a.maxX > b.minX && a.minX < b.maxX &&
         a.maxY > b.minY && a.minY < b.maxY;
}

/* ---------------- Stage builder ---------------- */
const THEMES = [
  {sky:0x77cfff, fog:0x77cfff, ground:0x248b44, accent:0x22bb66, decor:0x175c2f},
  {sky:0xffd38a, fog:0xffcb80, ground:0xc29a50, accent:0x9a7332, decor:0x7a5c28},
  {sky:0x9cefff, fog:0x9cefff, ground:0x65a8d0, accent:0x2896c9, decor:0x216a92},
  {sky:0x180d2b, fog:0x210d3a, ground:0x3a2d6b, accent:0x9b3cff, decor:0x5b2e8f},
  {sky:0x0d1830, fog:0x102040, ground:0x2a4a72, accent:0x2bb8ff, decor:0x1a3b6a},
  {sky:0x380508, fog:0x4d0708, ground:0x7a2a10, accent:0xff5500, decor:0x5e1c07}
];

function addSolidBox(minX,maxX,minY,maxY,depth,color,visible=true){
  const w = Math.max(0.01, maxX - minX);
  const h = Math.max(0.01, maxY - minY);
  if(w <= 0.01 || h <= 0.01) return null;
  const geo = new THREE.BoxGeometry(w,h,depth);
  const mat = new THREE.MeshLambertMaterial({color});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((minX+maxX)/2, (minY+maxY)/2, 0);
  mesh.visible = !!visible;
  scene.add(mesh);
  const obj = {mesh, minX, maxX, minY, maxY};
  platforms.push(obj);
  return obj;
}
function addPlatform(x1,x2,top){
  if(!theme) return null;
  return addSolidBox(x1,x2,top-PLATFORM_THICKNESS,top,1.6,theme.ground,true);
}
function addWall(x1,x2,top){
  return addSolidBox(x1,x2,-6,top,1.2,0x151515,true);
}
function addHazard(x1,x2,top){
  if(x2 - x1 <= 0) return;
  const h = 0.7;
  const geo = new THREE.BoxGeometry(Math.max(0.1,x2-x1), h, 1.5);
  const mat = new THREE.MeshPhongMaterial({color:0xff2222, emissive:0x330000});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((x1+x2)/2, top+h/2, 0);
  scene.add(mesh);
  hazards.push({mesh, minX:x1, maxX:x2, minY:top, maxY:top+h});
}
function addCoin(x,y){
  const geo = new THREE.OctahedronGeometry(0.34);
  const mat = new THREE.MeshPhongMaterial({color:0xffe14d, emissive:0x332200});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x,y,0);
  scene.add(mesh);
  coins.push({mesh,x,y,collected:false});
}
function addCoins(x,y){
  for(let i=0;i<3;i++){
    const ox = (i-1)*0.85;
    const oy = Math.abs(i-1)*0.22;
    addCoin(x+ox,y+oy);
  }
}
function addCheckpoint(x,top){
  const group = new THREE.Group();
  const poleGeo = new THREE.CylinderGeometry(0.08,0.10,3.2,8);
  const poleMat = new THREE.MeshPhongMaterial({color:0xbbbbbb});
  const pole = new THREE.Mesh(poleGeo,poleMat);
  pole.position.set(0,1.6,0);
  group.add(pole);

  const flagGeo = new THREE.BoxGeometry(1.15,0.55,0.12);
  const flagMat = new THREE.MeshPhongMaterial({color:0xff3355, emissive:0x330011});
  const flag = new THREE.Mesh(flagGeo, flagMat);
  flag.position.set(0.58,2.85,0);
  group.add(flag);

  group.position.set(x, top, 0);
  scene.add(group);
  const checkpoint = {mesh:group, flagMesh:flag, x, y:top, activated:false};
  checkpoints.push(checkpoint);
  return checkpoint;
}
function addDecorations(endX, rng){
  const n = 36;
  for(let i=0;i<n;i++){
    const x = rng() * (endX + 50) - 12;
    const z = -4.5 - rng() * 18;
    const kind = rng();
    let geo;
    if(kind < 0.35){
      geo = new THREE.CylinderGeometry(0.18,0.5,5+rng()*5,6);
    }else if(kind < 0.65){
      geo = new THREE.ConeGeometry(1+rng()*2,4+rng()*7,6);
    }else{
      geo = new THREE.BoxGeometry(1+rng()*3,1+rng()*8,1);
    }
    const mat = new THREE.MeshLambertMaterial({color:theme ? theme.decor : 0x224422});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.set(x, 0.5 + rng()*2, z);
    mesh.rotation.y = rng() * Math.PI;
    scene.add(mesh);
    decorations.push({mesh});
  }
}

function createEnemyMesh(type, cfg){
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({color:cfg.color, emissive:0x000000});
  let body;

  if(type === "flyer" || type === "ghost"){
    const sphereMat = type === "ghost"
      ? new THREE.MeshPhongMaterial({color:cfg.color, transparent:true, opacity:0.68, emissive:0x000000})
      : mat;
    body = new THREE.Mesh(new THREE.SphereGeometry(cfg.w*0.55, 10, 8), sphereMat);
    const wingGeo = new THREE.BoxGeometry(cfg.w*0.9, 0.08, 0.22);
    const wingMat = new THREE.MeshPhongMaterial({color:cfg.color});
    const w1 = new THREE.Mesh(wingGeo, wingMat);
    const w2 = new THREE.Mesh(wingGeo, wingMat);
    w1.position.set(0, 0, 0.42); w2.position.set(0, 0, -0.42);
    g.add(w1); g.add(w2);
  }else if(type === "turret"){
    body = new THREE.Mesh(new THREE.CylinderGeometry(cfg.w*0.5, cfg.w*0.62, cfg.h, 10), mat);
    body.rotation.z = Math.PI/2;
  }else if(type === "slime"){
    body = new THREE.Mesh(new THREE.SphereGeometry(cfg.w*0.55, 10, 8), mat);
  }else if(type === "selfdestruct"){
    body = new THREE.Mesh(new THREE.IcosahedronGeometry(cfg.w*0.55, 0), mat);
  }else{
    body = new THREE.Mesh(new THREE.BoxGeometry(cfg.w, cfg.h, cfg.w*0.75), mat);
  }

  g.add(body);

  const eyeGeo = new THREE.SphereGeometry(Math.max(0.05, cfg.w*0.11), 6, 6);
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
  const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
  eye1.position.set(cfg.w*0.24, cfg.h*0.18, cfg.w*0.38);
  eye2.position.set(cfg.w*0.24, cfg.h*0.18, -cfg.w*0.38);
  g.add(eye1); g.add(eye2);

  if(type === "shield"){
    const shGeo = new THREE.BoxGeometry(0.22, cfg.h*1.25, cfg.w*1.2);
    const shMat = new THREE.MeshPhongMaterial({color:0x00ffff, emissive:0x003344});
    const shield = new THREE.Mesh(shGeo, shMat);
    shield.position.set(cfg.w*0.75, 0, 0);
    g.add(shield);
  }
  if(type === "lava"){
    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(cfg.w*0.3, cfg.h*0.45, 6),
      new THREE.MeshBasicMaterial({color:0xffaa22})
    );
    flame.position.set(0, cfg.h*0.75, 0);
    g.add(flame);
  }
  return {group:g, body:body, bodyMaterial:mat};
}

function createEnemy(type, x, top, minX, maxX){
  const cfg = ENEMY_TYPES[type];
  if(!cfg) return null;

  const scale = 1 + stageIndex * 0.014;
  const w = cfg.w * scale;
  const h = cfg.h * scale;
  let y = top + h/2;
  let baseY = y;

  if(type === "flyer" || type === "ghost"){
    baseY = top + 1.5 + Math.random()*1.8;
    y = baseY;
  }

  const visualCfg = Object.assign({}, cfg, {w, h});
  const meshObj = createEnemyMesh(type, visualCfg);
  const mesh = meshObj.group;
  mesh.position.set(x,y,0);
  mesh.rotation.y = 0;
  scene.add(mesh);

  const hp = cfg.hp + Math.floor((stageIndex - 1)/2);
  const speed = cfg.speed * (1 + stageIndex * 0.022);

  const e = {
    type,
    pattern:cfg.pattern,
    dead:false,
    mesh,
    body:meshObj.body,
    color:cfg.color,
    x, y, baseY,
    halfW:w/2,
    halfH:h/2,
    hp, maxHp:hp,
    speed,
    minX, maxX,
    dir:1,
    facing:1,
    time:Math.random()*100,
    flash:0,
    shieldFront:!!cfg.shieldFront,
    shootTimer:1 + Math.random()*2,
    shootInterval:cfg.shoot ? 1.5 : 0,
    attackId:0,
    score:cfg.score || 20
  };

  if(type === "flyer"){
    e.startX = x;
    e.patrolRange = Math.max(1.5, (maxX - minX) * 0.28);
  }

  enemies.push(e);
  return e;
}

function chooseEnemyType(stage, rng){
  const pool = [];
  const add = (type,w)=> pool.push({type,w});

  add("walker", 4);
  if(stage >= 2){
    add("flyer", 3);
    add("turret", 2);
  }
  if(stage >= 3){
    add("slime", 2.5);
    add("heavy", 1.2);
  }
  if(stage >= 4){
    add("selfdestruct", 2.2);
    add("shield", 1.1);
  }
  if(stage >= 5){
    add("sniper", 2.2);
    add("ghost", 1.5);
  }
  if(stage >= 6){
    add("lava", 2.5);
  }

  let sum = 0;
  for(const p of pool) sum += p.w;
  let r = rng() * sum;
  for(const p of pool){
    if(r < p.w) return p.type;
    r -= p.w;
  }
  return "walker";
}

function placeEnemiesOnPlatform(p, rng){
  if(!p || p.maxX - p.minX < 4.5) return;
  const margin = 0.95;
  if(p.maxX - p.minX < margin*2) return;
  let count = 1;
  if(stageIndex >= 4 && rng() < 0.28) count++;
  if(stageIndex >= 8 && rng() < 0.22) count++;

  for(let i=0;i<count;i++){
    const type = chooseEnemyType(stageIndex, rng);
    const x = p.minX + margin + rng() * Math.max(0.1, (p.maxX - p.minX - margin*2));
    createEnemy(type, x, p.maxY, p.minX + margin, p.maxX - margin);
  }
}

function buildStage(stageNo){
  theme = THEMES[(stageNo - 1) % THEMES.length];
  scene.background = new THREE.Color(theme.sky);
  scene.fog = new THREE.Fog(theme.fog, 42, 135);

  stageInitialSpawn = {x:0, y:2};
  stageKills = 0;
  stageCoins = 0;

  const rng = mulberry32(stageNo * 1013904223 + 987654321);

  // Starting ground
  addPlatform(-14, 18, 0);
  createEnemy("walker", 7, 0, 2, 15);

  const endX = 118 + stageNo * 12;
  const bossX = endX + 28;

  let curX = 18;
  let curY = 0;
  let segment = 0;

  while(curX < endX - 30){
    segment++;
    const gap = Math.min(4.15, 1.7 + rng()*2.2 + stageNo*0.11);
    const width = Math.max(5.2, 5.0 + rng()*6.0 + stageNo*0.18);
    const nextX = curX + gap;

    let nextY = curY + (rng()*2 - 1) * (1.35 + Math.min(stageNo,8)*0.22);
    nextY = Math.max(-1.0, Math.min(2.35, nextY));

    const p = addPlatform(nextX, nextX + width, nextY);
    curX = nextX + width;
    curY = nextY;

    if(p){
      if(rng() < 0.42) addCoins(nextX + width*0.5, nextY + 1.35);

      if(stageNo >= 3 && rng() < 0.24 && width > 4.5){
        const sx = nextX + 1.2 + rng()*(width - 3.2);
        addHazard(sx, sx + 1.25, nextY);
      }

      if(rng() < 0.22){
        const hx = nextX + width*0.5;
        const upperFloorTop = nextY + PLAYER_HALF_HEIGHT*2 + PLATFORM_THICKNESS + 0.2;
        const hp = addPlatform(hx-1.55, hx+1.55, upperFloorTop);
        if(hp) addCoin(hx, hp.maxY+1.15);
      }

      if(segment % 5 === 0){
        addCheckpoint(curX - 2.5, curY);
      }

      if(curX > 34 && curX < endX - 48){
        placeEnemiesOnPlatform(p, rng);
      }
    }
  }

  // Connecting ground to boss arena
  let cx = Math.max(curX, endX - 28);
  while(cx < bossX - 14){
    const nx = Math.min(cx + 12, bossX - 14);
    addPlatform(cx, nx, 0);
    cx = nx;
  }

  // Boss arena
  addPlatform(bossX - 14, bossX + 14, 0);
  const bossEntranceWall = addWall(bossX - 15.2, bossX - 14.0, 20);
  addWall(bossX + 14.0, bossX + 15.2, 20);
  const bossCheckpoint = addCheckpoint(bossX - 24, 0);
  bossCheckpoint.wallToRemove = bossEntranceWall;

  const bossOrder = [
    "charge", "cannon", "jumper", "summoner",
    "shield", "laser", "swift", "void"
  ];
  const bossType = bossOrder[(stageNo - 1) % bossOrder.length];
  createBoss(bossType, bossX, 0, stageNo);

  addDecorations(endX, rng);
}

/* ---------------- Enemies ---------------- */
const ENEMY_TYPES = {
  walker:{hp:2,w:0.58,h:0.92,color:0x66dd44,speed:2.2,pattern:"patrol",score:20},
  heavy:{hp:6,w:1.25,h:1.55,color:0x9944cc,speed:1.4,pattern:"patrol",score:45},
  flyer:{hp:2,w:0.58,h:0.55,color:0xff44aa,speed:2.4,pattern:"fly",score:25},
  turret:{hp:4,w:0.9,h:0.85,color:0x5566ff,speed:0,pattern:"turret",shoot:1,score:35},
  slime:{hp:3,w:0.78,h:0.66,color:0x33dd77,speed:0,pattern:"hop",score:30},
  selfdestruct:{hp:2,w:0.56,h:0.56,color:0xff7700,speed:3.0,pattern:"chase",score:40},
  shield:{hp:8,w:0.82,h:1.18,color:0x17d2d2,speed:1.8,pattern:"patrol",shieldFront:true,score:55},
  sniper:{hp:4,w:0.72,h:1.15,color:0xd4c030,speed:0,pattern:"sniper",shoot:1,score:50},
  ghost:{hp:4,w:0.62,h:1.12,color:0x8888ff,speed:2.0,pattern:"ghost",score:45},
  lava:{hp:4,w:0.74,h:0.98,color:0xff3311,speed:1.8,pattern:"patrol",score:40}
};

function updateNormalEnemy(e, dt){
  e.time += dt;
  if(e.dead) return;

  if(e.flash > 0){
    e.flash -= dt;
    if(e.body && e.body.material.emissive){
      e.body.material.emissive.setHex(e.flash > 0 ? 0xff2222 : 0x000000);
    }
  }

  const p = player;
  if(!p) return;

  if(e.pattern === "patrol"){
    e.x += e.speed * e.dir * dt;
    if(e.x > e.maxX){ e.x = e.maxX; e.dir = -1; }
    if(e.x < e.minX){ e.x = e.minX; e.dir = 1; }
    if(e.type === "shield"){
      const d = Math.sign(p.x - e.x) || e.dir;
      e.dir = d;
    }
    e.facing = e.dir;
  }
  else if(e.pattern === "fly"){
    if(typeof e.startX === "number"){
      e.x = e.startX + Math.sin(e.time * e.speed) * e.patrolRange;
      e.y = e.baseY + Math.sin(e.time * 2.7) * 0.8;
    }else{
      e.x += Math.sin(e.time * e.speed) * 2.2 * dt;
    }
    e.facing = (p.x > e.x) ? 1 : -1;
  }
  else if(e.pattern === "ghost"){
    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const d = Math.hypot(dx,dy) || 1;
    e.x += dx/d * e.speed * dt;
    e.y += dy/d * e.speed * 0.72 * dt;
    e.y += Math.sin(e.time*5) * 0.015;
    e.facing = Math.sign(dx) || e.facing;
  }
  else if(e.pattern === "hop"){
    e.y = e.baseY + Math.abs(Math.sin(e.time * 2.3)) * 1.35;
  }
  else if(e.pattern === "chase"){
    const dx = p.x - e.x;
    const d = Math.sign(dx) || 1;
    e.facing = d;
    e.x += d * e.speed * dt;

    if(Math.abs(dx) < 2.0 && Math.abs(p.y - e.y) < 2.4){
      damagePlayer(1);
      killEnemy(e);
      return;
    }
  }
  else if(e.pattern === "turret" || e.pattern === "sniper"){
    e.facing = (p.x > e.x) ? 1 : -1;
    e.shootTimer -= dt;
    const near = Math.abs(p.x - e.x) < 26 && Math.abs(p.y - e.y) < 14;
    if(e.shootTimer <= 0 && near){
      shootEnemy(e);
      e.shootTimer = e.type === "sniper" ? 2.45 : 1.45;
    }
  }

  if(e.mesh){
    e.mesh.position.set(e.x,e.y,0);
    e.mesh.rotation.y = (e.facing >= 0) ? 0 : Math.PI;
  }
}

function shootEnemy(e){
  const p = player;
  if(!p) return;
  const ang = Math.atan2(p.y - e.y, p.x - e.x);
  const speed = (e.type === "sniper") ? 28 : 13;
  const r = 0.24;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 8, 8),
    new THREE.MeshBasicMaterial({color:0xff4455})
  );
  const bx = e.x + Math.cos(ang) * (e.halfW + 0.15);
  const by = e.y + Math.sin(ang) * Math.max(0.25, e.halfH*0.35);
  mesh.position.set(bx, by, 0);
  scene.add(mesh);
  enemyBullets.push({
    x:bx, y:by,
    vx:Math.cos(ang)*speed,
    vy:Math.sin(ang)*speed,
    r, life:4.2, homing:false, mesh
  });
  playSound("shoot");
}

function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  stageKills++;
  spawnExplosion(e.x, e.y, e.color || 0xffffff);
  if(e.type !== "boss") score += e.score;
  playSound("explosion");

  if(e.type === "boss"){
    stageVictory();
  }

  const idx = enemies.indexOf(e);
  if(idx >= 0) enemies.splice(idx,1);
  disposeObject(e.mesh);
  if(e === boss) boss = null;
}

function damageEnemy(e, dmg, source="melee", side=0){
  if(!e || e.dead || e.hp <= 0) return;

  if(source === "stomp" && e.type === "boss") return;

  if(e.shieldFront){
    if(source === "melee" && side === e.facing){
      playSound("block");
      spawnHitEffect(e.x + e.facing * e.halfW, e.y, 0x00ffff);
      return;
    }
    if(source === "bullet" && side === e.facing){
      playSound("block");
      spawnHitEffect(e.x, e.y, 0x00ffff);
      return;
    }
  }

  e.hp -= dmg;
  e.flash = 0.16;
  if(e.body && e.body.material.emissive) e.body.material.emissive.setHex(0xff2222);
  if(e.type === "boss") playSound("bossHit");
  else playSound("hit");

  if(e.hp <= 0) killEnemy(e);
}

/* ---------------- Boss ---------------- */
const BOSS_CONFIG = {
  charge:{hp:22, speed:3.4, size:2.25, color:0xff6644},
  cannon:{hp:26, speed:1.7, size:2.15, color:0xffcc22},
  jumper:{hp:24, speed:3.0, size:2.45, color:0x55ff77},
  summoner:{hp:30, speed:2.1, size:2.25, color:0xaa33ff},
  shield:{hp:34, speed:3.0, size:2.65, color:0x14d9d9},
  laser:{hp:30, speed:2.25, size:2.85, color:0x3399ff},
  swift:{hp:20, speed:5.4, size:1.95, color:0xff22bb},
  void:{hp:42, speed:2.5, size:3.15, color:0xffffff}
};

function createBossMesh(type, size, color){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({color, emissive:0x000000});
  const body = new THREE.Mesh(new THREE.SphereGeometry(size*0.45, 18, 12), bodyMat);
  g.add(body);

  const eyeGeo = new THREE.SphereGeometry(size*0.085, 8, 8);
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const e1 = new THREE.Mesh(eyeGeo, eyeMat);
  const e2 = new THREE.Mesh(eyeGeo, eyeMat);
  e1.position.set(size*0.18, size*0.12, size*0.35);
  e2.position.set(size*0.18, size*0.12, -size*0.35);
  g.add(e1); g.add(e2);

  if(type === "charge"){
    const hornGeo = new THREE.ConeGeometry(size*0.14, size*0.55, 6);
    const hornMat = new THREE.MeshPhongMaterial({color:0xffe0d0});
    const h1 = new THREE.Mesh(hornGeo, hornMat);
    const h2 = new THREE.Mesh(hornGeo, hornMat);
    h1.position.set(size*0.25, size*0.35, size*0.35);
    h1.rotation.z = -0.7; h1.rotation.x = -0.4;
    h2.position.set(size*0.25, size*0.35, -size*0.35);
    h2.rotation.z = -0.7; h2.rotation.x = 0.4;
    g.add(h1); g.add(h2);
  }
  if(type === "cannon"){
    const barrelGeo = new THREE.CylinderGeometry(size*0.14,size*0.18,size*0.95,8);
    const barrelMat = new THREE.MeshPhongMaterial({color:0xffee88});
    const b1 = new THREE.Mesh(barrelGeo, barrelMat);
    const b2 = new THREE.Mesh(barrelGeo, barrelMat);
    b1.rotation.z = Math.PI/2; b2.rotation.z = Math.PI/2;
    b1.position.set(size*0.65, size*0.18, 0);
    b2.position.set(size*0.65,-size*0.18, 0);
    g.add(b1); g.add(b2);
  }
  if(type === "jumper"){
    const legGeo = new THREE.BoxGeometry(size*0.22,size*0.65,size*0.22);
    const legMat = new THREE.MeshPhongMaterial({color:0x22cc55});
    const l1 = new THREE.Mesh(legGeo, legMat);
    const l2 = new THREE.Mesh(legGeo, legMat);
    l1.position.set(-size*0.18,-size*0.55, size*0.35);
    l2.position.set(-size*0.18,-size*0.55,-size*0.35);
    g.add(l1); g.add(l2);
  }
  if(type === "summoner"){
    const staffGeo = new THREE.CylinderGeometry(size*0.05,size*0.05,size*1.3,6);
    const staffMat = new THREE.MeshPhongMaterial({color:0xddaa33});
    const staff = new THREE.Mesh(staffGeo, staffMat);
    staff.position.set(size*0.65,-0.2,0);
    g.add(staff);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(size*0.18, 10, 8),
      new THREE.MeshBasicMaterial({color:0xff00ff})
    );
    orb.position.set(size*0.65,size*0.48,0);
    g.add(orb);
  }
  if(type === "shield"){
    const shieldGeo = new THREE.BoxGeometry(size*0.15,size*1.15,size*0.85);
    const shieldMat = new THREE.MeshPhongMaterial({color:0x22ffff, emissive:0x003344});
    const sh = new THREE.Mesh(shieldGeo, shieldMat);
    sh.position.set(size*0.68, 0, 0);
    g.add(sh);
  }
  if(type === "laser"){
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(size*0.22, 12, 10),
      new THREE.MeshBasicMaterial({color:0x00ccff})
    );
    core.position.set(size*0.48,0,0);
    g.add(core);
  }
  if(type === "swift"){
    const scarf = new THREE.Mesh(
      new THREE.BoxGeometry(size*1.3, size*0.12, size*0.35),
      new THREE.MeshPhongMaterial({color:0xff2222})
    );
    scarf.position.set(-size*0.55, size*0.1, 0);
    g.add(scarf);
  }
  if(type === "void"){
    const ringGeo = new THREE.TorusGeometry(size*0.72, size*0.06, 8, 16);
    const ringMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.7});
    for(let i=0;i<3;i++){
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = i * 0.8;
      ring.position.y = i*0.1 - 0.1;
      g.add(ring);
    }
  }
  return {group:g, body};
}

function createBoss(type, x, top, stageNo){
  const cfg = BOSS_CONFIG[type];
  const scale = 1 + stageNo * 0.011;
  const size = cfg.size * scale;
  const halfW = size * 0.46;
  const halfH = size * 0.55;
  const hp = cfg.hp + stageNo * 5;

  const m = createBossMesh(type, size, cfg.color);
  const mesh = m.group;
  mesh.position.set(x, halfH, 0);
  scene.add(mesh);

  const e = {
    type:"boss",
    bossType:type,
    dead:false,
    mesh,
    body:m.body,
    color:cfg.color,
    x,
    y:halfH,
    halfW,
    halfH,
    hp,
    maxHp:hp,
    speed:cfg.speed * (1 + stageNo * 0.022),
    minX:x - 12.5,
    maxX:x + 12.5,
    baseY:halfH,
    spawnX:x,
    facing:-1,
    state:"idle",
    stateTime:0,
    attackCooldown:3.2,
    shieldFront:(type === "shield"),
    time:0,
    flash:0,
    vy:0,
    jumpDir:0,
    jumpSpeed:0,
    chargeDir:0,
    dashDir:0,
    fireTimer:0,
    sumTimer:0,
    laserFired:false,
    targetY:0,
    attackId:0
  };
  enemies.push(e);
  boss = e;
}

function clampBossX(e){
  if(e.x < e.minX) e.x = e.minX;
  if(e.x > e.maxX) e.x = e.maxX;
}

function endBossAttack(e){
  e.state = "idle";
  e.stateTime = 0;
  e.vy = 0;
  e.y = e.baseY;
  e.attackCooldown = Math.max(0.85, 2.35 - stageIndex*0.085 - Math.random()*0.6);
}

function spawnBossBullet(x,y,vx,vy,homing=false,color=0xff4444){
  const r = 0.27;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 8, 8),
    new THREE.MeshBasicMaterial({color})
  );
  mesh.position.set(x,y,0);
  scene.add(mesh);
  enemyBullets.push({x,y,vx,vy,r,life:5.5,homing,mesh});
}

function spawnBossFanBullets(e, extra=0, homing=false){
  const p = player;
  if(!p) return;
  const n = Math.min(8, 3 + Math.floor(stageIndex/2) + extra);
  const baseAng = Math.atan2(p.y - (e.y + 0.4), p.x - e.x);
  const spread = 0.72;
  const speed = e.bossType === "swift" ? 24 : (homing ? 9 : 18);
  for(let i=0;i<n;i++){
    const offset = n === 1 ? 0 : ((i - (n-1)/2) * (spread / Math.max(1, n-1)));
    const ang = baseAng + offset;
    spawnBossBullet(
      e.x + Math.cos(ang) * (e.halfW + 0.25),
      e.y + Math.sin(ang) * Math.max(0.28, e.halfH*0.45),
      Math.cos(ang) * speed,
      Math.sin(ang) * speed,
      homing,
      homing ? 0xffffff : 0xff5533
    );
  }
}
function spawnRingBullets(e){
  const n = 10;
  const speed = 14;
  for(let i=0;i<n;i++){
    const ang = (i/n) * Math.PI * 2;
    spawnBossBullet(e.x, e.y, Math.cos(ang)*speed, Math.sin(ang)*speed, false, 0xff77ff);
  }
}
function spawnShockwave(e){
  const y = Math.max(0.5, e.baseY - e.halfH*0.3);
  const speed = 20;
  spawnBossBullet(e.x - e.halfW - 0.2, y, -speed, 0, false, 0xffcc00);
  spawnBossBullet(e.x + e.halfW + 0.2, y, speed, 0, false, 0xffcc00);
}
function spawnLaserLine(e){
  const y = clamp(e.targetY, -1, 10);
  for(let oy=-1.4; oy<=1.4; oy += 0.7){
    spawnBossBullet(
      e.x + e.facing * (e.halfW + 0.3),
      y + oy,
      e.facing * 32,
      0,
      false,
      0x22ddff
    );
  }
}
function summonMinion(e){
  const p = player;
  if(!p) return;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = clamp(e.x + side * (3 + Math.random()*7), e.minX + 2, e.maxX - 2);
  const types = ["walker","flyer","slime","selfdestruct"];
  const type = types[Math.floor(Math.random()*types.length)];
  const top = (type === "flyer" || type === "selfdestruct") ? 0 : 0;
  createEnemy(type, x, top, e.minX + 2, e.maxX - 2);
}

function bossJump(e){
  e.state = "jump";
  e.stateTime = 2.4;
  e.vy = 17;
  e.jumpDir = e.facing;
  e.jumpSpeed = Math.min(11, Math.abs(player.x - e.x)*0.75 + 3.5);
}

function startBossAttack(e){
  if(!player) return;
  const dir = e.facing;

  if(e.bossType === "charge"){
    if(Math.random() < 0.55){
      e.state = "charge";
      e.stateTime = 1.25;
      e.chargeDir = dir;
    }else{
      bossJump(e);
    }
  }else if(e.bossType === "cannon"){
    e.state = "cannon";
    e.stateTime = 1.65;
    e.fireTimer = 0.2;
  }else if(e.bossType === "jumper"){
    bossJump(e);
  }else if(e.bossType === "summoner"){
    e.state = "summon";
    e.stateTime = 1.9;
    e.sumTimer = 0.3;
  }else if(e.bossType === "shield"){
    e.state = "charge";
    e.stateTime = 1.45;
    e.chargeDir = dir;
  }else if(e.bossType === "laser"){
    e.state = "laser";
    e.stateTime = 1.5;
    e.laserFired = false;
    e.targetY = clamp(player.y, -1, 8);
  }else if(e.bossType === "swift"){
    e.state = "swiftDash";
    e.stateTime = 1.05;
    e.dashDir = dir;
    spawnBossFanBullets(e, 1);
  }else if(e.bossType === "void"){
    const r = Math.random();
    if(r < 0.34){
      e.state = "cannon";
      e.stateTime = 1.8;
      e.fireTimer = 0.15;
    }else if(r < 0.62){
      bossJump(e);
    }else if(r < 0.80){
      e.state = "summon";
      e.stateTime = 2.1;
      e.sumTimer = 0.35;
    }else{
      e.state = "homingBarrage";
      e.stateTime = 2.0;
      e.fireTimer = 0.25;
    }
  }else{
    e.state = "cannon";
    e.stateTime = 1.6;
    e.fireTimer = 0.2;
  }
}

function updateBoss(e, dt){
  e.time += dt;
  if(e.dead) return;

  if(e.flash > 0){
    e.flash -= dt;
    if(e.body && e.body.material.emissive){
      e.body.material.emissive.setHex(e.flash > 0 ? 0xff0000 : 0x000000);
    }
  }

  const p = player;
  if(!p) return;
  const dx = p.x - e.x;
  e.facing = dx >= 0 ? 1 : -1;

  if(e.state === "idle"){
    if(e.bossType === "cannon"){
      const desired = Math.abs(dx) < 9 ? -e.facing * e.speed * 0.7 : e.facing * e.speed * 0.45;
      e.x += desired * dt;
    }else{
      e.x += e.facing * e.speed * dt;
    }
    clampBossX(e);
    e.attackCooldown -= dt;
    if(e.attackCooldown <= 0){
      startBossAttack(e);
    }
  }else{
    if(e.state === "charge"){
      e.x += e.chargeDir * 11.5 * dt;
      clampBossX(e);
    }
    else if(e.state === "swiftDash"){
      e.x += e.dashDir * 17 * dt;
      clampBossX(e);
    }
    else if(e.state === "jump"){
      e.vy -= 34 * dt;
      e.y += e.vy * dt;
      e.x += e.jumpDir * e.jumpSpeed * dt;
      clampBossX(e);
      if(e.y <= e.baseY){
        e.y = e.baseY;
        e.vy = 0;
        spawnRingBullets(e);
        endBossAttack(e);
        return;
      }
    }
    else if(e.state === "cannon"){
      e.fireTimer -= dt;
      if(e.fireTimer <= 0){
        spawnBossFanBullets(e, 1);
        e.fireTimer = 0.42;
      }
    }
    else if(e.state === "summon"){
      e.sumTimer -= dt;
      if(e.sumTimer <= 0){
        summonMinion(e);
        e.sumTimer = 0.7;
      }
    }
    else if(e.state === "homingBarrage"){
      e.fireTimer -= dt;
      if(e.fireTimer <= 0){
        spawnBossFanBullets(e, 2, true);
        e.fireTimer = 0.55;
      }
    }
    else if(e.state === "laser"){
      if(!e.laserFired && e.stateTime < 0.72){
        spawnLaserLine(e);
        e.laserFired = true;
      }
    }

    if(e.state !== "jump"){
      e.stateTime -= dt;
      if(e.stateTime <= 0){
        endBossAttack(e);
      }
    }
  }

  if(e.mesh){
    e.mesh.position.set(e.x, e.y, 0);
    e.mesh.rotation.y = (e.facing >= 0) ? 0 : Math.PI;
  }
}

function collideWithPlatforms(p, axis){
  const pb = playerBox(p);
  for(const pl of platforms){
    if(!aabb(pb, pl)) continue;

    if(axis === "x"){
      if(p.vx > 0){
        p.x = pl.minX - p.halfW - 0.015;
      }else if(p.vx < 0){
        p.x = pl.maxX + p.halfW + 0.015;
      }
      p.vx = 0;
    }else{
      if(p.vy <= 0){
        p.y = pl.maxY + p.halfH + 0.01;
        p.vy = 0;
        p.onGround = true;
        p.jumpCount = 0;
      }else{
        p.y = pl.minY - p.halfH - 0.01;
        p.vy = 0;
      }
    }
    // Rebuild local player box after correction
    pb.minX = p.x - p.halfW;
    pb.maxX = p.x + p.halfW;
    pb.minY = p.y - p.halfH;
    pb.maxY = p.y + p.halfH;
  }
}

function startMeleeAttack(p){
  p.attackTimer = 0.18;
  p.attackCooldown = 0.34;
  p.attackId++;
  playSound("attack");
}
function shootPlayer(p){
  const bx = p.x + p.face * 0.7;
  const by = p.y + 0.1;
  const r = 0.18;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 8, 8),
    new THREE.MeshBasicMaterial({color:0x00ffff})
  );
  mesh.position.set(bx,by,0);
  scene.add(mesh);
  playerBullets.push({
    x:bx,y:by,
    vx:p.face * 37,
    vy:0,
    r,
    dmg:2,
    life:2.6,
    mesh
  });
  p.shootCooldown = 0.27;
  p.gunRecoil = 0.35;
  playSound("shoot");
}

function damagePlayer(dmg=1){
  if(!player || state !== "playing") return;
  if(player.invuln > 0) return;

  player.hp -= dmg;
  player.invuln = 1.15;
  cameraShake = 0.45;
  playSound("hurt");
  if(player.hp < 0) player.hp = 0;
}

function respawnPlayer(){
  if(!player) return;
  save.deaths = (save.deaths || 0) + 1;
  saveNow();

  const p = player;
  p.hp = p.maxHp;
  p.x = p.spawnX;
  p.y = p.spawnY;
  p.vx = 0;
  p.vy = 0;
  p.onGround = false;
  p.jumpCount = 0;
  p.invuln = 2.0;
  p.attackTimer = 0;
  p.shootCooldown = 0.5;

  clearArray(playerBullets);
  clearArray(enemyBullets);

  if(boss){
    boss.hp = boss.maxHp;
    boss.x = boss.spawnX;
    boss.y = boss.baseY;
    boss.vx = 0;
    boss.vy = 0;
    boss.state = "idle";
    boss.stateTime = 0;
    boss.attackCooldown = 2.5;
    if(boss.mesh) boss.mesh.position.set(boss.x,boss.y,0);
  }
}

function updatePlayerMovement(dt){
  const p = player;
  if(!p) return;

  if(p.invuln > 0) p.invuln -= dt;
  if(p.attackTimer > 0) p.attackTimer -= dt;
  if(p.attackCooldown > 0) p.attackCooldown -= dt;
  if(p.shootCooldown > 0) p.shootCooldown -= dt;
  if(p.gunRecoil > 0) p.gunRecoil = Math.max(0, p.gunRecoil - dt * 3);

  // Jump request
  if(input.jumpRequest){
    input.jumpRequest = false;
    if(p.jumpCount < p.maxJumps){
      p.vy = (p.jumpCount === 0) ? JUMP_V : JUMP_V * 0.92;
      p.jumpCount++;
      p.onGround = false;
      playSound(p.jumpCount === 1 ? "jump" : "doubleJump");
    }
  }

  // Horizontal movement
  const accel = p.onGround ? 52 : 31;
  if(input.left){
    p.vx -= accel * dt;
    p.face = -1;
  }
  if(input.right){
    p.vx += accel * dt;
    p.face = 1;
  }
  if(!input.left && !input.right){
    const f = p.onGround ? 30 : 11;
    if(Math.abs(p.vx) < 0.8) p.vx = 0;
    else p.vx -= Math.sign(p.vx) * f * dt;
  }
  p.vx = clamp(p.vx, -MOVE_SPEED, MOVE_SPEED);

  // Gravity
  p.vy -= GRAVITY * dt;
  p.vy = Math.max(p.vy, -MAX_FALL);

  // Move & collide
  p.x += p.vx * dt;
  collideWithPlatforms(p, "x");

  p.y += p.vy * dt;
  p.onGround = false;
  collideWithPlatforms(p, "y");

  // Actions
  if(input.attackHeld && p.attackCooldown <= 0){
    startMeleeAttack(p);
  }
  if(input.shootHeld && p.shootCooldown <= 0){
    shootPlayer(p);
  }

  // Pit death
  if(p.y < -28){
    p.hp = 0;
  }
}

function updatePlayerMesh(p){
  if(!p || !p.mesh) return;
  p.mesh.position.set(p.x, p.y, 0);
  p.mesh.rotation.y = (p.face >= 0) ? 0 : Math.PI;

  if(p.invuln > 0){
    p.mesh.visible = (Math.floor(time * 18) % 2) === 0;
  }else{
    p.mesh.visible = true;
  }

  if(p.attackTimer > 0){
    const progress = clamp(1 - (p.attackTimer / 0.18), 0, 1);
    p.sword.rotation.z = -2.2 + progress * 4.4;
  }else{
    p.sword.rotation.z = Math.sin(time * 4) * 0.08;
  }

  p.gun.position.x = 0.42 - p.gunRecoil * 0.22;
}

function checkMeleeHits(){
  if(!player || player.attackTimer <= 0) return;
  const ab = attackBox(player);

  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(!e || e.dead) continue;
    if(e.attackId === player.attackId) continue;
    if(aabb(ab, entityBox(e))){
      e.attackId = player.attackId;
      const side = Math.sign(player.x - e.x);
      damageEnemy(e, 3, "melee", side);
    }
  }
}

function checkPlayerEnemyCollisions(){
  if(!player || state !== "playing") return;
  const pb = playerBox(player);

  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(!e || e.dead) continue;
    const eb = entityBox(e);
    if(!aabb(pb, eb)) continue;

    // Stomp for normal enemies
    if(e.type !== "boss" && player.vy < 0 &&
       (player.y - player.halfH) > (e.y + e.halfH * 0.15)){
      damageEnemy(e, 3, "stomp");
      player.vy = 8.5;
      player.jumpCount = Math.min(player.jumpCount, 1);
      continue;
    }

    if(e.type === "selfdestruct"){
      killEnemy(e);
    }else{
      damagePlayer(1);
    }
  }
}

function checkHazards(){
  if(!player || player.invuln > 0) return;
  const pb = playerBox(player);
  for(const h of hazards){
    if(aabb(pb, h)){
      damagePlayer(1);
      spawnHitEffect(player.x, player.y, 0xff3333);
    }
  }
}

function updatePickups(dt){
  if(!player) return;
  const pb = playerBox(player);

  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i];
    c.mesh.rotation.y += dt * 3;
    c.mesh.position.y = c.y + Math.sin(time*2 + i)*0.2;

    const cb = {minX:c.x-0.4,maxX:c.x+0.4,minY:c.y-0.4,maxY:c.y+0.4};
    if(aabb(pb, cb)){
      score += 10;
      stageCoins++;
      playSound("coin");
      spawnHitEffect(c.x, c.y, 0xffdd00);
      disposeObject(c.mesh);
      coins.splice(i,1);
    }
  }

  for(const cp of checkpoints){
    if(cp.activated) continue;
    if(Math.abs(player.x - cp.x) < 1.0 && Math.abs(player.y - cp.y) < 3.0){
      cp.activated = true;
      cp.flagMesh.material.color.set(0x00ff66);
      cp.flagMesh.material.emissive.set(0x005522);
      player.spawnX = cp.x;
      player.spawnY = cp.y + 1.0;
      if(cp.wallToRemove){
        const wallIndex = platforms.indexOf(cp.wallToRemove);
        if(wallIndex !== -1){
          platforms.splice(wallIndex, 1);
          disposeObject(cp.wallToRemove.mesh);
          cp.wallToRemove = null;
        }
      }
      playSound("checkpoint");
    }
  }
}

/* ---------------- Bullets ---------------- */
function bulletHitsPlatforms(b){
  const bb = bulletBox(b);
  for(const p of platforms){
    if(aabb(bb, p)) return true;
  }
  return false;
}
function removeBullet(list, idx){
  const b = list[idx];
  if(b && b.mesh) disposeObject(b.mesh);
  list.splice(idx,1);
}

function updatePlayerBullets(dt){
  for(let i=playerBullets.length-1;i>=0;i--){
    if(state !== "playing") break;
    const b = playerBullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if(b.mesh) b.mesh.position.set(b.x,b.y,0);

    if(b.life <= 0 || bulletHitsPlatforms(b)){
      removeBullet(playerBullets, i);
      continue;
    }

    let removed = false;
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(!e || e.dead) continue;
      if(aabb(bulletBox(b), entityBox(e))){
        const side = Math.sign(b.x - e.x);
        if(e.shieldFront && side === e.facing){
          playSound("block");
          spawnHitEffect(b.x,b.y,0x00ffff);
          removeBullet(playerBullets,i);
          removed = true;
          break;
        }
        damageEnemy(e,b.dmg,"bullet",side);
        spawnHitEffect(b.x,b.y,0x00ffff);
        removeBullet(playerBullets,i);
        removed = true;
        break;
      }
    }
    if(removed) continue;
  }
}

function updateEnemyBullets(dt){
  if(!player) return;
  const pb = playerBox(player);

  for(let i=enemyBullets.length-1;i>=0;i--){
    if(state !== "playing") break;
    const b = enemyBullets[i];

    if(b.homing){
      const dx = player.x - b.x;
      const dy = player.y - b.y;
      const d = Math.hypot(dx,dy) || 1;
      b.vx += dx/d * 18 * dt;
      b.vy += dy/d * 18 * dt;
      const sp = Math.hypot(b.vx,b.vy);
      const max = 15;
      if(sp > max){ b.vx *= max/sp; b.vy *= max/sp; }
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if(b.mesh) b.mesh.position.set(b.x,b.y,0);

    if(b.life <= 0 || bulletHitsPlatforms(b)){
      removeBullet(enemyBullets,i);
      continue;
    }

    if(player.invuln <= 0 && aabb(bulletBox(b), pb)){
      damagePlayer(1);
      spawnHitEffect(b.x,b.y,0xff3355);
      removeBullet(enemyBullets,i);
    }
  }
}

/* ---------------- Effects ---------------- */
function addEffect(mesh, life, vx=0, vy=0){
  scene.add(mesh);
  effects.push({mesh, life, maxLife:life, vx, vy});
}
function spawnHitEffect(x,y,color){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 8, 8),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9})
  );
  mesh.position.set(x,y,0);
  addEffect(mesh, 0.28);
}
function spawnExplosion(x,y,color){
  for(let i=0;i<10;i++){
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.22,0.22,0.22),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.95})
    );
    mesh.position.set(x,y,0);
    addEffect(
      mesh,
      0.42,
      (Math.random()-0.5)*9,
      Math.random()*7 + 1
    );
  }
  spawnHitEffect(x,y,0xffffff);
}
function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const f = effects[i];
    f.life -= dt;
    if(f.life <= 0){
      disposeObject(f.mesh);
      effects.splice(i,1);
      continue;
    }
    f.mesh.position.x += f.vx * dt;
    f.mesh.position.y += f.vy * dt;
    f.vy -= 10 * dt;
    const progress = 1 - (f.life / f.maxLife);
    f.mesh.scale.setScalar(Math.max(0.01, 0.4 + progress*2.0));
    if(f.mesh.material) f.mesh.material.opacity = Math.max(0, f.life / f.maxLife);
  }
}

/* ---------------- Camera & HUD ---------------- */
function updateCamera(dt){
  if(!player) return;
  let tx = player.x + 9;
  let ty = player.y + 6;
  const tz = 18;

  if(cameraShake > 0){
    cameraShake -= dt;
    const s = cameraShake * 1.5;
    tx += (Math.random()-0.5) * s;
    ty += (Math.random()-0.5) * s;
  }

  const lerp = 1 - Math.exp(-6.0 * dt);
  camera.position.x += (tx - camera.position.x) * lerp;
  camera.position.y += (ty - camera.position.y) * lerp;
  camera.position.z += (tz - camera.position.z) * lerp;
  camera.lookAt(player.x, player.y, 0);
}

function updateHUD(){
  if(!player) return;
  $("stageHud").textContent = t("stage") + " " + stageIndex;
  $("scoreHudText").textContent = t("score") + ": " + score;

  const hearts = "❤".repeat(Math.max(0, Math.ceil(player.hp)));
  $("hpHud").textContent = t("hp") + " " + hearts;

  if(boss){
    $("bossBar").style.display = "block";
    $("bossName").textContent = t("boss") + ": " + bossNameFor(boss.bossType);
    const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    $("bossBarFill").style.width = pct + "%";
  }else{
    $("bossBar").style.display = "none";
  }
}

/* ---------------- Stage clear ---------------- */
function stageVictory(){
  if(state !== "playing") return;
  state = "clear";

  save.unlocked = Math.max(save.unlocked, Math.min(MAX_STAGE + 1, stageIndex + 1));
  save.coins = (save.coins || 0) + stageCoins;
  save.kills = (save.kills || 0) + stageKills;
  save.totalScore = (save.totalScore || 0) + score;
  saveNow();

  showResult(true);
}

/* ---------------- Game flow ---------------- */
function startStage(n){
  n = clamp(n, 1, MAX_STAGE);
  initAudio();

  stageIndex = n;
  score = 0;
  stageCoins = 0;
  stageKills = 0;
  input.left = input.right = input.attackHeld = input.shootHeld = false;
  input.jumpRequest = false;

  hidePanels();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

  $("hud").style.display = "block";
  $("scoreHud").style.display = "block";

  clearGameObjects();
  buildStage(n);

  player = createPlayer(stageInitialSpawn.x, stageInitialSpawn.y);
  player.spawnX = stageInitialSpawn.x;
  player.spawnY = stageInitialSpawn.y;

  camera.position.set(player.x + 9, player.y + 6, 18);
  camera.lookAt(player.x, player.y, 0);

  state = "playing";
  updateHUD();
}

function togglePause(){
  if(state === "playing"){
    state = "paused";
    input.left = input.right = input.attackHeld = input.shootHeld = false;
    input.jumpRequest = false;
    saveNow();
    showPanel("pausePanel");
    $("hud").style.display = "none";
    $("bossBar").style.display = "none";
  }else if(state === "paused"){
    state = "playing";
    hidePanels();
    $("hud").style.display = "block";
  }
}

/* ---------------- Update main ---------------- */
function update(dt){
  if(state !== "playing" || !player) return;

  time += dt;

  updatePlayerMovement(dt);
  if(state !== "playing") return;

  for(let i=enemies.length-1;i>=0;i--){
    if(state !== "playing") break;
    const e = enemies[i];
    if(!e || e.dead) continue;
    if(e.type === "boss") updateBoss(e, dt);
    else updateNormalEnemy(e, dt);
  }

  updatePlayerBullets(dt);
  if(state !== "playing") return;
  updateEnemyBullets(dt);
  if(state !== "playing") return;

  checkMeleeHits();
  if(state !== "playing") return;
  checkPlayerEnemyCollisions();
  checkHazards();
  updatePickups(dt);

  if(player && player.hp <= 0){
    respawnPlayer();
  }

  updatePlayerMesh(player);
  updateEffects(dt);
  updateCamera(dt);
  updateHUD();
}

/* ---------------- Render loop ---------------- */
function animate(){
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.05);

  if(state === "playing"){
    update(dt);
  }else{
    updateEffects(dt);
    if(player && (state === "clear" || state === "menu" || state === "paused")){
      // freeze visual except subtle idle
      updatePlayerMesh(player);
      updateCamera(dt);
    }
  }

  renderer.render(scene, camera);
}

/* ---------------- Input ---------------- */
function bindHoldButton(id, key){
  const el = $(id);
  if(!el) return;
  const down = (e)=>{
    e.preventDefault();
    el.classList.add("active");
    input[key] = true;
    initAudio();
  };
  const up = (e)=>{
    e.preventDefault();
    el.classList.remove("active");
    input[key] = false;
  };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
}

function bindTouchControls(){
  bindHoldButton("btnLeft", "left");
  bindHoldButton("btnRight", "right");
  bindHoldButton("btnAttack", "attackHeld");
  bindHoldButton("btnShoot", "shootHeld");

  const jump = $("btnJump");
  if(jump){
    jump.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      jump.classList.add("active");
      input.jumpRequest = true;
      initAudio();
    });
    const clear = (e)=>{
      e.preventDefault();
      jump.classList.remove("active");
    };
    jump.addEventListener("pointerup", clear);
    jump.addEventListener("pointercancel", clear);
    jump.addEventListener("pointerleave", clear);
  }
}

function initKeyboard(){
  window.addEventListener("keydown", (e)=>{
    const tag = e.target && e.target.tagName ? e.target.tagName : "";
    if(tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;

    if(e.code === "Escape" || e.code === "KeyP"){
      if(state === "playing" || state === "paused"){
        e.preventDefault();
        togglePause();
      }
      return;
    }

    if(state !== "playing") return;

    if(e.code === "ArrowLeft" || e.code === "KeyA"){
      input.left = true;
      e.preventDefault();
    }
    if(e.code === "ArrowRight" || e.code === "KeyD"){
      input.right = true;
      e.preventDefault();
    }
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){
      if(!e.repeat) input.jumpRequest = true;
      initAudio();
      e.preventDefault();
    }
    if(e.code === "KeyX" || e.code === "KeyJ"){
      input.attackHeld = true;
      initAudio();
      e.preventDefault();
    }
    if(e.code === "KeyZ" || e.code === "KeyK"){
      input.shootHeld = true;
      initAudio();
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", (e)=>{
    if(e.code === "ArrowLeft" || e.code === "KeyA") input.left = false;
    if(e.code === "ArrowRight" || e.code === "KeyD") input.right = false;
    if(e.code === "KeyX" || e.code === "KeyJ") input.attackHeld = false;
    if(e.code === "KeyZ" || e.code === "KeyK") input.shootHeld = false;
  });

  window.addEventListener("blur", ()=>{
    input.left = input.right = input.attackHeld = input.shootHeld = false;
    input.jumpRequest = false;
  });
}

/* ---------------- UI events ---------------- */
function initUIEvents(){
  $("startBtn").onclick = () => {
    initAudio();
    playSound("menu");
    startStage(1);
  };
  $("continueBtn").onclick = () => {
    initAudio();
    playSound("menu");
    startStage(Math.min(MAX_STAGE, save.unlocked));
  };
  $("stageSelectBtn").onclick = () => {
    initAudio();
    playSound("menu");
    updateStageSelect();
    showPanel("stagePanel");
  };
  $("stageBackBtn").onclick = () => showPanel("menuPanel");
  $("helpBtn").onclick = () => showPanel("helpPanel");
  $("helpBackBtn").onclick = () => showPanel("menuPanel");
  $("settingsBtn").onclick = () => showPanel("settingsPanel");
  $("settingsBackBtn").onclick = () => showPanel("menuPanel");

  $("langSelect").addEventListener("change", (e)=>{
    save.lang = e.target.value;
    saveNow();
    updateLanguage();
  });
  $("soundBtn").onclick = () => {
    save.sound = !save.sound;
    saveNow();
    updateLanguage();
    if(save.sound) playSound("menu");
  };

  $("resumeBtn").onclick = () => togglePause();
  $("restartBtn").onclick = () => startStage(stageIndex);
  $("quitBtn").onclick = () => showMenu();

  $("nextBtn").onclick = () => {
    if(stageIndex < MAX_STAGE) startStage(stageIndex + 1);
    else showMenu();
  };
  $("retryResultBtn").onclick = () => startStage(stageIndex);
  $("menuBtn").onclick = () => showMenu();

  $("fullscreenBtn").onclick = async () => {
    try{
      initAudio();
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
        try{ await screen.orientation.lock("landscape"); }catch(e){}
      }else{
        await document.exitFullscreen();
      }
    }catch(e){}
  };

  bindTouchControls();
  initKeyboard();
}

/* ---------------- Init ---------------- */
function init(){
  loadSave();
  initUIEvents();
  updateLanguage();
  initThree();
  showMenu();

  lastTime = performance.now();
  animate();
}

window.addEventListener("load", init);
</script>
